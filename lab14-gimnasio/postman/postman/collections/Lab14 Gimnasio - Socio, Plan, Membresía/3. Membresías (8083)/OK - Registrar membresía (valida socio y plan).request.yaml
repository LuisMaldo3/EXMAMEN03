$kind: http-request
url: ""
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "idSocio": "{{idSocio}}",
      "idPlan": "{{idPlan}}",
      "fechaInicio": "2026-11-10",
      "fechaFin": "2026-12-10"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Código HTTP 201', function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set('idMembresia', pm.response.json().id);
      pm.test('Copia el precio del plan', function () { pm.expect(pm.response.json().precioPlan).to.eql(95.5); });
    language: text/javascript
order: 1000
