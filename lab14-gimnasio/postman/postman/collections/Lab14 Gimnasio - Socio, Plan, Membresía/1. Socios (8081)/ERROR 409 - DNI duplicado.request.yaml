$kind: http-request
url: ""
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dni": "{{dni}}",
      "nombres": "Luis Miguel",
      "apellidos": "Maldonado Linares",
      "correo": "otro{{dni}}@mail.com",
      "telefono": "987654321"
    }
scripts:
  - type: afterResponse
    code: pm.test('Código HTTP 409', function () { pm.response.to.have.status(409); });
    language: text/javascript
order: 5000
