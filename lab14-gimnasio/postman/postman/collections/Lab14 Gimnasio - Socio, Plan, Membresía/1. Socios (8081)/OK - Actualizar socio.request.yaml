$kind: http-request
url: ""
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dni": "{{dni}}",
      "nombres": "Luis Miguel",
      "apellidos": "Maldonado Linares",
      "correo": "socio{{dni}}@mail.com",
      "telefono": "912345678"
    }
scripts:
  - type: afterResponse
    code: pm.test('Código HTTP 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
