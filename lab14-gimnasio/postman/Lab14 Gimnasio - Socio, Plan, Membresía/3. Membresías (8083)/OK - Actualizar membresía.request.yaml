$kind: http-request
url: "{{membresiaUrl}}/api/membresias/{{idMembresia}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "idSocio": "{{idSocio}}",
      "idPlan": "{{idPlan}}",
      "fechaInicio": "2026-11-10",
      "fechaFin": "2026-12-25"
    }
scripts:
  - type: afterResponse
    code: pm.test('Código HTTP 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 5000
